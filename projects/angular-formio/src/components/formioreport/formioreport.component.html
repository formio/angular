<div role="form" [attr.aria-label]="label">
  @if (isReportLoading && !hideLoading) {
    <div style="position: relative; height: 200px">
      <formio-loader [isLoading]="isReportLoading"></formio-loader>
    </div>
  }
  @if (
    this.options.alertsPosition === AlertsPosition.top ||
    this.options.alertsPosition === AlertsPosition.both
  ) {
    <formio-alerts (focusComponent)="focusOnComponet($event)" [alerts]="alerts"></formio-alerts>
  }
  <div #report></div>
  @if (
    this.options.alertsPosition === AlertsPosition.bottom ||
    this.options.alertsPosition === AlertsPosition.both
  ) {
    <formio-alerts (focusComponent)="focusOnComponet($event)" [alerts]="alerts"></formio-alerts>
  }
</div>
