@if (config.includeSearch) {
  <div role="search" class="input-group mb-3">
    <input
      #search
      type="text"
      (keyup)="onSearch()"
      class="form-control"
      placeholder="Search Forms"
      aria-label="Search Forms"
      aria-describedby="button-search"
    />
    @if (search && search !== '') {
      <span class="form-clear input-group-addon" (click)="clearSearch()">
        <span class="fa fa-times bi bi-x"></span>
      </span>
    }
  </div>
}

@if (service.ready) {
  <formio-grid
    [formio]="service.formio"
    [gridType]="'form'"
    [query]="gridQuery"
    [isActionAllowed]="service.actionAllowed"
    x
    (rowAction)="onAction($event)"
    (rowSelect)="onSelect($event)"
    (createItem)="onCreateItem()"
  ></formio-grid>
}
